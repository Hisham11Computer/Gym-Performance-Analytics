name: CI

on:
  push:
  pull_request:

jobs:
  validate-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build DB, run data-quality checks and analysis queries
        run: python scripts/run_pipeline.py
